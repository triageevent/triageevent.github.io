<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRIAGE - GAME MODE</title>

<link rel="stylesheet" href="gamemode.css">

</head>


<body>


<div class="wallpaper" id="wallpaper"></div>

<div class="dark-filter"></div>

<div class="scanlines"></div>


<main class="game-menu">


    <div class="operation-title">

        <div class="operation-main">
            GAME MODE
        </div>


        <div class="operation-subtitle">
            select operation phase
        </div>

    </div>



    <nav class="mode-options">

        <a href="#" onclick="changeMode('nightfall')">
            NIGHTFALL
        </a>


        <a href="#" onclick="changeMode('sunrise')">
            SUNRISE
        </a>


        <a href="#" onclick="changeMode('dawn')">
            DAWN
        </a>

    </nav>



    <div class="mode-description" id="description">

        Choose your battlefield

    </div>



</main>


<script src="gamemode.js"></script>

</body>

</html>
