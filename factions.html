<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRIAGE - FACTIONS</title>

<link rel="stylesheet" href="factions.css">

</head>


<body>


<div class="wallpaper" id="wallpaper"></div>

<div class="dark-filter"></div>

<div class="scanlines"></div>

<canvas id="factionParticles"></canvas>

<img src="drone.png" id="drone" alt="">

<img src="drone.png" id="drone" alt="">
<div class="scan-cone" id="scanCone"></div>

<main class="faction-menu">

    <a href="operation.html" class="back-button">
    &lt; BACK
</a>


    <div class="faction-title">

        <div class="faction-main">
            FACTIONS
        </div>


        <div class="faction-subtitle">
            choose your side
        </div>

    </div>



    <div class="faction-options" id="factionOptions">

  <button onclick="changeFaction('stars')">STARS</button>
<button onclick="changeFaction('specops')">SPEC OPS</button>
<button onclick="changeFaction('ubcs')">UBCS</button>
<button onclick="changeFaction('uss')">USS</button>

</div>


<div class="choose-text" id="chooseText">
    CHOOSE YOUR FACTION
</div>


<div class="faction-tabs" id="factionTabs">

    <button onclick="showFactionSection('intro')">
        INTRO
    </button>

    <button onclick="showFactionSection('armory')">
        ARMORY
    </button>

</div>


<div class="faction-content" id="factionContent">

</div>


</main>


<div id="transition"></div>


<script src="factions.js"></script>


</body>

</html>
