<div class="wallpaper" id="wallpaper"></div>

<img src="drone.png" id="drone" alt="">

<img src="drone.png" id="drone" alt="">
<div class="screen-scan" id="screenScan"></div>

<main class="faction-menu">

    <a href="operation.html" class="back-button">
    &lt; BACK
</a>


    <div class="faction-title">

        <div class="faction-main">
            FACTIONS
        </div>


        <div class="faction-subtitle">
            choose your side
        </div>

    </div>



    <div class="faction-options" id="factionOptions">

  <button onclick="changeFaction('stars')">STARS</button>
<button onclick="changeFaction('specops')">SPEC OPS</button>
<button onclick="changeFaction('ubcs')">UBCS</button>
<button onclick="changeFaction('uss')">USS</button>

</div>


<div class="choose-text" id="chooseText">
    CHOOSE YOUR FACTION

</main>


<div id="transition"></div>

<script src="audio.js"></script>
<script src="factions.js"></script>

<div id="debugOverflow" style="position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font-size:11px;padding:8px;z-index:99999;max-height:40vh;overflow:auto;font-family:monospace;"></div>

<script>
window.addEventListener("load", () => {
    setTimeout(() => {
        const vw = window.innerWidth;
        const all = document.querySelectorAll("*");
        let report = `viewport width: ${vw}px\n\n`;

        all.forEach(el => {
            const rect = el.getBoundingClientRect();
            if(rect.right > vw + 1 || rect.left < -1){
                report += `${el.tagName}.${el.className || "(no class)"} → left:${Math.round(rect.left)} right:${Math.round(rect.right)}\n`;
            }
        });

        document.getElementById("debugOverflow").textContent = report;
    }, 1500);
});
</script>
</body>

</html>
