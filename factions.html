<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRIAGE - FACTIONS</title>

<link rel="stylesheet" href="factions.css">

</head>


<body>
<div id="musicToggle" onclick="toggleMusic()">🔊</div>

<div class="wallpaper" id="wallpaper"></div>

<div class="dark-filter"></div>

<div class="scanlines"></div>

<canvas id="factionParticles"></canvas>

<div id="langToggle" onclick="toggleLang()">EN</div>

<img id="drone" src="drone.png" alt="Recon Drone">

<div id="droneScore" class="drone-score">

    <div class="score-title" data-cz="SKÓRE" data-en="SCORE">SCORE</div>

    <div class="score-line">
        <span data-cz="SESTŘELENO" data-en="SHOT DOWN">SHOT DOWN</span>
        <strong id="operatorScoreValue">0</strong>
    </div>

</div>
    
<div class="screen-scan" id="screenScan"></div>

<div class="drone-scan-flash" id="droneScanFlash"></div>


<button
    id="sendDroneBtn"
    class="send-drone-btn"
    onclick="sendAnotherDrone()"
    data-cz="ODESLAT DALŠÍ DRON"
    data-en="SEND ANOTHER DRONE">
    SEND ANOTHER DRONE
</button>
    
<main class="faction-menu">

    <a href="operation.html" class="back-button">
    &lt; BACK
</a>


<div class="faction-title">

    <div class="faction-main" data-cz="FRAKCE" data-en="FACTIONS">FACTIONS</div>

    <div class="faction-subtitle" data-cz="vyber si stranu" data-en="choose your side">choose your side</div>

</div>



    <div class="faction-options" id="factionOptions">

  <button onclick="changeFaction('stars')">STARS</button>
<button onclick="changeFaction('specops')">SPEC OPS</button>
<button onclick="changeFaction('ubcs')">UBCS</button>
<button onclick="changeFaction('uss')">USS</button>

</div>


<div class="choose-text" id="chooseText" data-cz="VYBER SI FRAKCI" data-en="CHOOSE YOUR FACTION">
    CHOOSE YOUR FACTION
</div>


<div class="faction-tabs" id="factionTabs">

    <button data-section="intro" onclick="showFactionSection('intro', this)" data-cz="ÚVOD" data-en="INTRO">
        INTRO
    </button>

    <button data-section="armory" onclick="showFactionSection('armory', this)" data-cz="ZBROJNICE" data-en="ARMORY">
        ARMORY
    </button>

</div>


<div class="faction-content" id="factionContent">

</div>


</main>
<div class="horde-layer" id="hordeLayer"></div>

<div id="hordeScore" class="drone-score">
    <div class="score-title" data-cz="SKÓRE HORDY" data-en="HORDE SCORE">HORDE SCORE</div>
    <div class="score-line">
        <span data-cz="ZABITO" data-en="KILLED">KILLED</span>
        <strong id="hordeScoreValue">0</strong>
        <b>·</b>
        <span data-cz="MISS" data-en="MISS">MISS</span>
        <strong id="hordeMissValue">0</strong>/10
    </div>
</div>

<button
    id="stopHordeBtn"
    class="stop-horde-btn"
    onclick="toggleHorde()"
    data-cz="ZASTAVIT HORDU"
    data-en="STOP HORDE">
    STOP HORDE
</button>
<div class="grenade-layer" id="grenadeLayer"></div>

<img id="ubcsBasket" class="ubcs-basket" src="basket.png" alt="">

<div id="grenadeScore" class="drone-score">
    <div class="score-title" data-cz="SKÓRE UBCS" data-en="UBCS SCORE">UBCS SCORE</div>
    <div class="score-line">
        <span data-cz="BODY" data-en="POINTS">POINTS</span>
        <strong id="grenadeScoreValue">0</strong>
        <b>·</b>
        <span data-cz="MISS" data-en="MISS">MISS</span>
        <strong id="grenadeMissValue">0</strong>/10
    </div>
</div>
    <button
    id="stopGrenadeBtn"
    class="stop-horde-btn"
    onclick="toggleGrenadeDrop()"
    data-cz="ZASTAVIT DÉŠŤ GRANÁTŮ"
    data-en="STOP GRENADE RAIN">
    STOP GRENADE RAIN
    </button>
    <div class="sample-layer" id="sampleLayer"></div>

<div id="sampleScore" class="drone-score">
    <div class="score-title" data-cz="SKÓRE USS" data-en="USS SCORE">USS SCORE</div>
    <div class="score-line">
        <span data-cz="BODY" data-en="POINTS">POINTS</span>
        <strong id="sampleScoreValue">0</strong>
        <b>·</b>
        <span data-cz="MISS" data-en="MISS">MISS</span>
        <strong id="sampleMissValue">0</strong>/10
    </div>
</div>

<button
    id="stopSampleBtn"
    class="stop-horde-btn"
    onclick="toggleSampleCollection()"
    data-cz="ZASTAVIT SBĚR VZORKŮ"
    data-en="STOP SAMPLE COLLECTION">
    STOP SAMPLE COLLECTION
</button>
<div id="transition"></div>
<script src="lang.js"></script>
<script src="audio.js"></script>
<script src="factions.js"></script>

<div id="debugOverflow" style="position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font-size:11px;padding:8px;z-index:99999;max-height:40vh;overflow:auto;font-family:monospace;"></div>

   

</body>

</html>
